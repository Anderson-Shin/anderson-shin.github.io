<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discrete Distribution Visualizer (PMF & CDF)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .tab-active {
            background-color: #4f46e5;
            color: white;
        }
        .tab-inactive {
            background-color: #e2e8f0;
            color: #475569;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #4f46e5;
            cursor: pointer;
            border-radius: 50%;
        }
        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #4f46e5;
            cursor: pointer;
            border-radius: 50%;
        }
    </style>
</head>
<body class="antialiased text-slate-800">

    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 tracking-tight">Discrete Distribution Visualizer</h1>
            <p class="mt-2 text-lg text-slate-600">Explore the PMF and CDF of common discrete probability distributions.</p>
        </header>

        <!-- Tabs for selecting distribution -->
        <div class="mb-6">
            <div class="flex flex-wrap justify-center gap-2 rounded-lg bg-slate-100 p-2" role="tablist">
                <button id="tab-bernoulli" class="tab-button tab-active flex-grow sm:flex-grow-0 px-4 py-2 text-sm font-semibold rounded-md transition-colors duration-200" role="tab">Bernoulli</button>
                <button id="tab-binomial" class="tab-button tab-inactive flex-grow sm:flex-grow-0 px-4 py-2 text-sm font-semibold rounded-md transition-colors duration-200" role="tab">Binomial</button>
                <button id="tab-geometric" class="tab-button tab-inactive flex-grow sm:flex-grow-0 px-4 py-2 text-sm font-semibold rounded-md transition-colors duration-200" role="tab">Geometric</button>
                <button id="tab-poisson" class="tab-button tab-inactive flex-grow sm:flex-grow-0 px-4 py-2 text-sm font-semibold rounded-md transition-colors duration-200" role="tab">Poisson</button>
            </div>
        </div>

        <!-- Distribution Panels -->
        <div class="bg-white p-6 rounded-2xl shadow-lg">
            <!-- Bernoulli Panel -->
            <div id="panel-bernoulli" class="panel">
                <h2 class="text-2xl font-bold mb-1">Bernoulli Distribution</h2>
                <div class="mb-4">
                    <label for="p-bernoulli" class="block font-medium mb-1">Probability of Success (p)</label>
                    <input id="p-bernoulli" type="range" min="0" max="1" step="0.01" value="0.5" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer slider">
                    <div class="text-center mt-1 font-mono" id="p-bernoulli-value">p = 0.50</div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div><canvas id="bernoulliPmfChart"></canvas></div>
                    <div><canvas id="bernoulliCdfChart"></canvas></div>
                </div>
            </div>

            <!-- Binomial Panel -->
            <div id="panel-binomial" class="panel hidden">
                <h2 class="text-2xl font-bold mb-1">Binomial Distribution</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="n-binomial" class="block font-medium mb-1">Number of Trials (n)</label>
                        <input id="n-binomial" type="range" min="1" max="50" step="1" value="20" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer slider">
                        <div class="text-center mt-1 font-mono" id="n-binomial-value">n = 20</div>
                    </div>
                    <div>
                        <label for="p-binomial" class="block font-medium mb-1">Probability of Success (p)</label>
                        <input id="p-binomial" type="range" min="0" max="1" step="0.01" value="0.5" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer slider">
                        <div class="text-center mt-1 font-mono" id="p-binomial-value">p = 0.50</div>
                    </div>
                </div>
                 <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div><canvas id="binomialPmfChart"></canvas></div>
                    <div><canvas id="binomialCdfChart"></canvas></div>
                </div>
            </div>

            <!-- Geometric Panel -->
            <div id="panel-geometric" class="panel hidden">
                 <h2 class="text-2xl font-bold mb-1">Geometric Distribution</h2>
                <div class="mb-4">
                    <label for="p-geometric" class="block font-medium mb-1">Probability of Success (p)</label>
                    <input id="p-geometric" type="range" min="0.01" max="1" step="0.01" value="0.2" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer slider">
                    <div class="text-center mt-1 font-mono" id="p-geometric-value">p = 0.20</div>
                </div>
                 <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div><canvas id="geometricPmfChart"></canvas></div>
                    <div><canvas id="geometricCdfChart"></canvas></div>
                </div>
            </div>

            <!-- Poisson Panel -->
            <div id="panel-poisson" class="panel hidden">
                <h2 class="text-2xl font-bold mb-1">Poisson Distribution</h2>
                <div class="mb-4">
                    <label for="lambda-poisson" class="block font-medium mb-1">Average Rate (λ)</label>
                    <input id="lambda-poisson" type="range" min="0.1" max="20" step="0.1" value="5" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer slider">
                    <div class="text-center mt-1 font-mono" id="lambda-poisson-value">λ = 5.0</div>
                </div>
                 <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div><canvas id="poissonPmfChart"></canvas></div>
                    <div><canvas id="poissonCdfChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- UTILITY FUNCTIONS ---
        const factorial = (() => {
            const cache = [1];
            return (n) => {
                if (n < 0) return NaN;
                if (n < cache.length) return cache[n];
                let result = cache[cache.length - 1];
                for (let i = cache.length; i <= n; i++) {
                    result *= i;
                    cache.push(result);
                }
                return result;
            };
        })();

        const combinations = (n, k) => {
            if (k < 0 || k > n) return 0;
            return factorial(n) / (factorial(k) * factorial(n - k));
        };

        // --- PMF/CDF CALCULATIONS ---
        const getBernoulliData = (p) => {
            const labels = ['0 (Failure)', '1 (Success)'];
            const pmf = [1 - p, p];
            const cdf = [1 - p, 1];
            return { labels, pmf, cdf };
        };

        const getBinomialData = (n, p) => {
            const labels = Array.from({ length: n + 1 }, (_, i) => i);
            const pmf = labels.map(k => combinations(n, k) * Math.pow(p, k) * Math.pow(1 - p, n - k));
            const cdf = pmf.reduce((acc, val) => {
                acc.push((acc.length > 0 ? acc[acc.length - 1] : 0) + val);
                return acc;
            }, []);
            return { labels, pmf, cdf };
        };
        
        const getGeometricData = (p) => {
            const labels = [], pmf = [], cdf = [];
            const limit = Math.max(20, Math.ceil(5 / p)); 
            for (let n = 1; n <= limit; n++) {
                labels.push(n);
                const prob = Math.pow(1 - p, n - 1) * p;
                pmf.push(prob);
                cdf.push((cdf.length > 0 ? cdf[cdf.length - 1] : 0) + prob);
            }
            return { labels, pmf, cdf };
        };

        const getPoissonData = (lambda) => {
            const labels = [], pmf = [], cdf = [];
            const limit = Math.ceil(Math.max(20, lambda + 4 * Math.sqrt(lambda)));
            for (let k = 0; k <= limit; k++) {
                labels.push(k);
                const prob = (Math.exp(-lambda) * Math.pow(lambda, k)) / factorial(k);
                pmf.push(prob);
                cdf.push((cdf.length > 0 ? cdf[cdf.length - 1] : 0) + prob);
            }
            return { labels, pmf, cdf };
        };

        // --- CHARTING LOGIC ---
        let charts = {};

        const createOrUpdateChart = (id, labels, data, title, isCDF = false) => {
            const ctx = document.getElementById(id).getContext('2d');
            if (charts[id]) {
                charts[id].data.labels = labels;
                charts[id].data.datasets[0].data = data;
                charts[id].update();
                return;
            }
            
            const chartConfig = {
                type: isCDF ? 'line' : 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: title,
                        data: data,
                        backgroundColor: isCDF ? 'rgba(168, 85, 247, 0.2)' : 'rgba(79, 70, 229, 0.6)',
                        borderColor: isCDF ? 'rgba(168, 85, 247, 1)' : 'rgba(79, 70, 229, 1)',
                        borderWidth: isCDF ? 2 : 1,
                        stepped: isCDF ? true : false,
                        pointRadius: 0,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: { display: true, text: title, font: {size: 16} },
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => `${isCDF ? 'F(X<=k)' : 'P(X=k)'} = ${context.raw.toFixed(4)}`
                            }
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            max: isCDF ? 1.1 : undefined,
                            title: { display: true, text: isCDF ? 'CDF F(k)' : 'PMF P(X = k)' }
                        },
                        x: { title: { display: true, text: 'k' } }
                    }
                }
            };
            
            if (!isCDF && id.includes('bernoulli')) {
                chartConfig.options.scales.x.ticks = {
                    callback: function(value, index, values) {
                        return this.getLabelForValue(value);
                    }
                };
            }

            charts[id] = new Chart(ctx, chartConfig);
        };

        // --- DOM & EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.tab-button');
            const panels = document.querySelectorAll('.panel');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.replace('tab-active', 'tab-inactive'));
                    panels.forEach(p => p.classList.add('hidden'));
                    tab.classList.replace('tab-inactive', 'tab-active');
                    document.getElementById(tab.id.replace('tab-', 'panel-')).classList.remove('hidden');
                });
            });

            // Sliders and value displays
            const bernoulliSlider = document.getElementById('p-bernoulli'), bernoulliValue = document.getElementById('p-bernoulli-value');
            const nBinomialSlider = document.getElementById('n-binomial'), pBinomialSlider = document.getElementById('p-binomial');
            const nBinomialValue = document.getElementById('n-binomial-value'), pBinomialValue = document.getElementById('p-binomial-value');
            const geometricSlider = document.getElementById('p-geometric'), geometricValue = document.getElementById('p-geometric-value');
            const poissonSlider = document.getElementById('lambda-poisson'), poissonValue = document.getElementById('lambda-poisson-value');
            
            // Init functions
            const initBernoulli = () => {
                const p = parseFloat(bernoulliSlider.value);
                bernoulliValue.textContent = `p = ${p.toFixed(2)}`;
                const { labels, pmf, cdf } = getBernoulliData(p);
                createOrUpdateChart('bernoulliPmfChart', labels, pmf, 'PMF');
                createOrUpdateChart('bernoulliCdfChart', labels, cdf, 'CDF', true);
            };

            const initBinomial = () => {
                const n = parseInt(nBinomialSlider.value), p = parseFloat(pBinomialSlider.value);
                nBinomialValue.textContent = `n = ${n}`;
                pBinomialValue.textContent = `p = ${p.toFixed(2)}`;
                const { labels, pmf, cdf } = getBinomialData(n, p);
                createOrUpdateChart('binomialPmfChart', labels, pmf, 'PMF');
                createOrUpdateChart('binomialCdfChart', labels, cdf, 'CDF', true);
            };
            
            const initGeometric = () => {
                const p = parseFloat(geometricSlider.value);
                geometricValue.textContent = `p = ${p.toFixed(2)}`;
                const { labels, pmf, cdf } = getGeometricData(p);
                createOrUpdateChart('geometricPmfChart', labels, pmf, 'PMF');
                createOrUpdateChart('geometricCdfChart', labels, cdf, 'CDF', true);
            };

            const initPoisson = () => {
                const lambda = parseFloat(poissonSlider.value);
                poissonValue.textContent = `λ = ${lambda.toFixed(1)}`;
                const { labels, pmf, cdf } = getPoissonData(lambda);
                createOrUpdateChart('poissonPmfChart', labels, pmf, 'PMF');
                createOrUpdateChart('poissonCdfChart', labels, cdf, 'CDF', true);
            };

            // Add event listeners
            bernoulliSlider.addEventListener('input', initBernoulli);
            [nBinomialSlider, pBinomialSlider].forEach(s => s.addEventListener('input', initBinomial));
            geometricSlider.addEventListener('input', initGeometric);
            poissonSlider.addEventListener('input', initPoisson);

            // Initial draw
            initBernoulli();
            initBinomial();
            initGeometric();
            initPoisson();
        });
    </script>
</body>
</html>
